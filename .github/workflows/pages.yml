name: publish project garden

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: verify garden
        run: |
          node --test tests/*.test.mjs
          node --check app.js
          node --check garden-core.js
          node --check plants.js
          node --check garden-export.js
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4

